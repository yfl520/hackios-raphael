[package]
name = "raphael-adreno-metal-bridge-ios16"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
[workspace]
[lib]
crate-type = ["staticlib"]
path = "../userland/bridge/NativeMetalBridge.rs"
[dependencies]
metal2vulkan = { path = "../translator/crates/metal2vulkan", features = ["ash"] }
metal2vulkan-runtime = { path = "../translator/crates/metal2vulkan-runtime" }
libc = "0.2"
sha2 = { version = "0.10", features = ["asm"] }
[profile.release]
panic = "unwind"
debug = 1
lto = "fat"
codegen-units = 1
